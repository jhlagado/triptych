[build]
target = "xtensa-esp32s3-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# Tag mode makes embuild clone the matching submodule revisions. The build
# wrapper independently verifies that the tag peels to the recorded commit.
ESP_IDF_VERSION = "tag:v5.5.5"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
ESP_IDF_COMPONENT_MANAGER = "false"
