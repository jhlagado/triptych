[package]
name = "triptych-host-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless WebAssembly host for the Triptych CPU machine"

[features]
default = []
conformance = ["triptych-cpu-core/conformance"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
triptych-cpu-core = { path = "../triptych-cpu-core" }
wasm-bindgen = "=0.2.127"
