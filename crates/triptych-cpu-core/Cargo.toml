[package]
name = "triptych-cpu-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable deterministic CPU machine for Triptych"

[features]
default = []
conformance = []

[dependencies]
cell80-z80 = "=0.8.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["conformance"]
